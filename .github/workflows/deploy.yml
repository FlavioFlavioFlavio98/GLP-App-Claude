name: Deploy Web App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # permette lancio manuale dalla UI GitHub

permissions:
  contents: write

# Evita deploy paralleli: annulla quello in corso se arriva un push più recente
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app (base /GLP-App-Claude/) + stamp SW cache version
        run: npm run build:web && node scripts/stamp-sw.js

      - name: Deploy to GitHub Pages (branch gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
