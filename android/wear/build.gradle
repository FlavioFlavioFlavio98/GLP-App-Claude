apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "com.flavio.glp"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.flavio.glp"
        minSdkVersion 30
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.11.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.wear.compose:compose-material:1.4.1'
    implementation 'androidx.wear.compose:compose-foundation:1.4.1'

    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    implementation 'androidx.wear:wear-input:1.2.0'
    // Ambient mode per i timer (pasto/meditazione): invece di forzare lo
    // schermo sempre acceso a piena luminosità (keepScreenOn), quando il
    // sistema passa in ambient si mostra una vista a basso consumo invece di
    // spegnere lo schermo — richiesta esplicita di Flavio.
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'com.google.firebase:firebase-firestore-ktx:25.0.0'
    implementation 'com.google.firebase:firebase-auth-ktx:23.0.0'

    // Tile "punti di oggi", raggiungibile scorrendo da destra sul quadrante
    // senza aprire l'app — richiesta esplicita di Flavio.
    implementation 'androidx.wear.tiles:tiles:1.4.0'
    implementation 'androidx.wear.tiles:tiles-material:1.4.0'
    // Solo per lo stato reale (LoadAction/State) delle Tile interattive —
    // il pacchetto androidx.wear.tiles.* incluso sopra è un involucro
    // deprecato su questo, e per lo State non porta con sé metodi veri
    // (Builder senza modo di impostare coppie chiave/valore): serve la
    // classe protolayout direttamente per completare una task dalla Tile
    // senza aprire l'app — richiesta esplicita di Flavio.
    implementation 'androidx.wear.protolayout:protolayout:1.1.0'
    implementation 'androidx.wear.protolayout:protolayout-material:1.1.0'
    implementation 'androidx.concurrent:concurrent-futures:1.2.0'
    implementation 'androidx.concurrent:concurrent-futures-ktx:1.2.0'
    implementation 'com.google.guava:guava:33.4.0-android'

    // Complicazione "Nuova task" sul quadrante — a differenza della Tile
    // (che richiede scorrere dal quadrante) tocco diretto sul quadrante
    // stesso, richiesta esplicita di Flavio.
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1'
}

apply plugin: 'com.google.gms.google-services'
