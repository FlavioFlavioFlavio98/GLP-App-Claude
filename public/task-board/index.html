<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Task di oggi</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0d0d10;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  .page {
    min-height: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 60px;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px; gap: 10px;
  }
  header h1 { font-size: 22px; font-weight: 800; color: #fff; margin: 0; }
  header .right { display: flex; align-items: center; gap: 10px; }
  header .clock { font-size: 12.5px; color: #777; white-space: nowrap; }
  .pip-btn {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
    color: #ccc; border-radius: 8px; width: 30px; height: 30px; flex-shrink: 0;
    font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .pip-btn:hover { background: rgba(255,255,255,0.14); color: #fff; }

  .empty { text-align: center; color: #555; font-size: 15px; padding: 60px 10px; }

  .row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 4px; border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .row.clickable { cursor: pointer; }
  .row.clickable:hover { background: rgba(255,255,255,0.03); }
  .row.done { opacity: 0.45; }
  .check {
    width: 19px; height: 19px; border-radius: 50%; margin-top: 2px; flex-shrink: 0;
    border: 2px solid #4A90D9; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 900; color: #fff;
  }
  .check.checked { background: #4CAF50; border-color: #4CAF50; }
  .main { flex: 1; min-width: 0; }
  .title { font-size: 16.5px; font-weight: 650; color: #f0f0f0; line-height: 1.4; }
  .row.done .title { text-decoration: line-through; }
  .desc { font-size: 13px; color: #888; margin-top: 2px; line-height: 1.4; }
  .meta { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
    background: rgba(255,255,255,0.06); color: #999;
  }
  .tag.expired { background: rgba(235,87,87,0.15); color: #EB5757; }
  .tag.done { background: rgba(76,175,80,0.15); color: #4CAF50; }
  .tag.reward { background: rgba(74,144,217,0.15); color: #4A90D9; }
  .tag.recurring { background: rgba(255,255,255,0.06); padding: 2px 6px; }

  footer {
    margin-top: auto; padding-top: 24px;
    text-align: center; font-size: 12.5px; color: #555;
  }

  /* Login */
  .login {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center;
  }
  .login p { font-size: 13px; color: #888; max-width: 280px; margin: 0; }
  .login input {
    width: 240px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    color: #eee; border-radius: 10px; padding: 10px 14px; font-size: 14px; outline: none;
  }
  .login button {
    width: 240px; padding: 10px; border-radius: 10px; border: none;
    background: #4A90D9; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .login .status { font-size: 12.5px; color: #EB5757; min-height: 16px; }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>📋 Task di oggi</h1>
      <div class="right">
        <span class="clock" id="clock"></span>
        <button class="pip-btn" id="pipBtn" title="Sempre in primo piano">📌</button>
      </div>
    </header>

    <div id="loginView" class="login" style="display:none">
      <p>Accedi con l'account dedicato<br/>(flavio.rossi95@gmail.com)</p>
      <input id="password" type="password" placeholder="Password" />
      <button id="loginBtn">Accedi</button>
      <div id="loginStatus" class="status"></div>
    </div>

    <div id="boardView" style="display:none; flex:1; flex-direction:column;">
      <div id="list"></div>
      <footer id="footer"></footer>
    </div>
  </div>

  <script src="board.bundle.js"></script>
</body>
</html>
